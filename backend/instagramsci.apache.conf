# Instagramsci — Apache2 virtual host (alternative to nginx).
# Serves the static site from public/, proxies /api/ to the gunicorn API, serves
# uploaded images, and falls back to index.html for client-side routes.
#
# Layout on the server (only public/ is web-visible):
#   /var/www/instagramsci/public/     index.html, css/, js/, assets/   <- DocumentRoot
#   /var/www/instagramsci/backend/    app.py, .env, venv/, uploads/    <- never served
#
# Enable required modules first:
#   sudo a2enmod proxy proxy_http headers rewrite
# Install:
#   sudo cp backend/instagramsci.apache.conf /etc/apache2/sites-available/instagramsci.conf
#   sudo a2ensite instagramsci
#   sudo a2dissite 000-default          # optional: drop the default site
#   sudo apache2ctl configtest          # should say: Syntax OK
#   sudo service apache2 restart        # Devuan uses sysvinit, not systemd
# HTTPS (after DNS points here):
#   sudo apt install certbot python3-certbot-apache
#   sudo certbot --apache -d instagramsci.example.org
#   certbot copies this vhost into a :443 one; the Directory blocks and headers
#   below come along with it.

<VirtualHost *:80>
    ServerName instagramsci.example.org
    DocumentRoot /var/www/instagramsci/public

    # ---- static site: public/ only ----
    <Directory /var/www/instagramsci/public>
        Require all granted
        Options -Indexes +FollowSymLinks
        AllowOverride None
    </Directory>

    # ---- belt and braces: the backend is never reachable, even if a future
    #      config points DocumentRoot one level up by mistake ----
    <Directory /var/www/instagramsci/backend>
        Require all denied
    </Directory>

    # ---- API -> gunicorn (Flask) on 127.0.0.1:8077 ----
    ProxyPreserveHost On
    ProxyPass        /api/  http://127.0.0.1:8077/
    ProxyPassReverse /api/  http://127.0.0.1:8077/
    LimitRequestBody 8388608          # 8 MB, matches the API's upload cap

    # ---- uploaded images (served by Apache, never executed) ----
    # The API re-encodes every image and names it <random>.jpg/.png, so nothing
    # here is a script. SetHandler none + nosniff make sure it stays that way.
    Alias /uploads/ /var/www/instagramsci/backend/uploads/
    <Directory /var/www/instagramsci/backend/uploads>
        Require all granted
        Options -Indexes -ExecCGI
        SetHandler none
        Header set Cache-Control "public, max-age=2592000"
    </Directory>

    # ---- security headers ----
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    # Browsers ignore HSTS over plain HTTP; it takes effect on the :443 copy.
    Header always set Strict-Transport-Security "max-age=31536000"

    # ---- correct MIME for ES modules + SVG (usually default, set to be safe) ----
    AddType application/javascript .js
    AddType image/svg+xml          .svg

    # ---- short cache for code (so fixes reach phones), long for images ----
    <FilesMatch "\.(css|js|html)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
    <FilesMatch "\.(svg|jpg|jpeg|png|webp|woff2?)$">
        Header set Cache-Control "public, max-age=2592000"
    </FilesMatch>

    # ---- SPA fallback: serve index.html for unknown paths,
    #      but never for /api, /uploads, or real files/dirs ----
    RewriteEngine On
    RewriteCond %{REQUEST_URI}      !^/api/
    RewriteCond %{REQUEST_URI}      !^/uploads/
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ /index.html [L]

    ErrorLog  ${APACHE_LOG_DIR}/instagramsci-error.log
    CustomLog ${APACHE_LOG_DIR}/instagramsci-access.log combined
</VirtualHost>
